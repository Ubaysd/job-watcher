# Filtres appliqués à toutes les sources (regex, insensibles à la casse)
filters:
  title_include: "product owner|product manager|chef de produit|program manager|programme manager|project manager|chef de projet|PMO|TPM|delivery manager|head of product|transformation|AI use case|deployment strategist"
  title_exclude: "\\bstage\\b|\\bintern\\b|internship|stagiaire|alternance|alternant|apprenti|apprentice|working student|graduate|\\bVIE\\b|V\\.I\\.E"
  location_include: "france|paris|ile-de-france|île-de-france|la défense|la defense|saint-ouen|nanterre|courbevoie|puteaux|issy|boulogne|levallois|montrouge|charenton|remote|hybrid"

# ats: auto -> le script teste Lever / Greenhouse / Ashby / SmartRecruiters avec les slugs candidats
# et mémorise celui qui répond (state.json).
# Grand filet : recherche publique LinkedIn (offres < 1h, France), filtrée sur big_companies.txt
linkedin:
  keywords: ["product owner", "product manager", "chef de projet", "program manager", "chef de produit", "PMO"]
  pages: 1   # 25 offres les plus récentes par mot-clé (au-delà, LinkedIn bloque en 429)

companies:
  - {name: LinkedIn,      ats: linkedin}

  # Tech / scale-ups (Mistral, Criteo, ManoMano, Spendesk, PayFit, Aircall, Deezer, Visa : couverts via LinkedIn)
  - {name: Datadog,       ats: greenhouse, slug: datadog}
  - {name: GitLab,        ats: greenhouse, slug: gitlab}
  - {name: Oracle,        ats: oracle, host: eeho.fa.us2.oraclecloud.com, site: CX_45001}
  - {name: Qonto,         ats: auto, slugs: [qonto]}
  - {name: Alan,          ats: auto, slugs: [alan]}
  - {name: Doctolib,      ats: auto, slugs: [doctolib]}
  - {name: Back Market,   ats: auto, slugs: [backmarket, back-market]}
  - {name: Dataiku,       ats: auto, slugs: [dataiku]}
  - {name: Contentsquare, ats: auto, slugs: [contentsquare]}
  - {name: Algolia,       ats: auto, slugs: [algolia]}
  - {name: BlaBlaCar,     ats: auto, slugs: [blablacar]}
  - {name: Swile,         ats: auto, slugs: [swile]}
  - {name: Pennylane,     ats: auto, slugs: [pennylane]}
  - {name: Mirakl,        ats: auto, slugs: [mirakl]}
  - {name: Ledger,        ats: auto, slugs: [ledger]}
  - {name: Agicap,        ats: auto, slugs: [agicap]}
  - {name: Sorare,        ats: auto, slugs: [sorare]}
  - {name: Stripe,        ats: auto, slugs: [stripe]}
  - {name: Spotify,       ats: auto, slugs: [spotify]}
  - {name: Ubisoft,       ats: auto, slugs: [Ubisoft2, Ubisoft]}

  # Workday : API appelée depuis le navigateur (sinon 429)
  - {name: Airbus,     ats: workday, host: ag.wd3.myworkdayjobs.com, tenant: ag, site: Airbus}
  - {name: Sanofi,     ats: workday, host: sanofi.wd3.myworkdayjobs.com, tenant: sanofi, site: SanofiCareers}
  - {name: Mastercard, ats: workday, host: mastercard.wd1.myworkdayjobs.com, tenant: mastercard, site: CorporateCareers}
  - {name: Salesforce, ats: workday, host: salesforce.wd12.myworkdayjobs.com, tenant: salesforce, site: External_Career_Site}

  # Grands groupes sans API publique -> rendu navigateur + diff des liens d'offres
  # (AXA, Allianz, BNP : site bloqué ou recherche introuvable -> couverts via LinkedIn)
  - name: Societe Generale
    ats: page
    url: "https://careers.societegenerale.com/rechercher?query=product%20owner"
    link_regex: "/offres-d-emploi/"
  - name: Amundi
    ats: page
    url: "https://jobs.amundi.com/job/list-of-jobs.aspx"
    link_regex: "_\\d+\\.aspx"
